site_name: Bhoonidhi Downloader
site_description: CLI for searching, saving, and downloading satellite imagery from ISRO's Bhoonidhi Earth Observation portal.
site_url: https://geovicco-dev.github.io/bhoonidhi-downloader/
repo_url: https://github.com/geovicco-dev/bhoonidhi-downloader
repo_name: geovicco-dev/bhoonidhi-downloader
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Examples: examples.md
  - API Reference:
      - Overview: api/index.md
      - Auth: api/auth.md
      - Archive: api/archive.md
      - Search: api/search.md
      - Query: api/query.md
      - Download: api/download.md
      - Schemas: api/schemas.md
  - Changelog: CHANGELOG.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.tooltips
    - content.code.annotation
    - content.code.copy
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: indigo
      accent: indigo
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: indigo
      accent: indigo

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_section_style: table
            members_order: source
            summary: true
            force_inspection: true
            filters:
              - "!^_"
            extensions:
              - griffe_pydantic:
                  schema: true

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/geovicco-dev
    - icon: fontawesome/brands/medium
      link: https://medium.com/@geovicco
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/adityasharma29520/
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/bhoonidhi-downloader/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: |
  &copy; 2024 <a href="https://github.com/geovicco-dev"  target="_blank" rel="noopener">Aditya Sharma</a>
