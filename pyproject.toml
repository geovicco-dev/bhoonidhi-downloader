[project]
name = "bhoonidhi-downloader"
version = "0.2.3"
description = "CLI for searching, saving, and downloading satellite data from Bhoonidhi"
license = "MIT"
authors = [
    { name = "geovicco-dev", email = "geovicco.dev@gmail.com" }
]
dependencies = [
    "typer>=0.12.3",
    "requests>=2.32.3",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "tabulate>=0.9.0",
]
readme = "README.md"
requires-python = ">= 3.10"

urls = { "Repository" = "https://github.com/geovicco-dev/bhoonidhi-downloader" }

[project.scripts]
"bhoonidhi-downloader" = "bhoonidhi_downloader.cli:app"
"bhd" = "bhoonidhi_downloader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ipykernel>=6.29.5",
    "pyyaml>=6.0.1",
    "cairosvg>=2.7.1",
    "mkdocs-material[imaging]>=9.5.30",
    "ipywidgets>=8.1.3",
    "python-dotenv>=1.2.2",
    "mkdocstrings[python]>=1.0.6",
    "griffe-pydantic>=1.3.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bhoonidhi_downloader"]

[tool.ruff.lint]
ignore = [
    "B008",   # typer.Option()/typer.Argument() as default args is the required idiom
    "DTZ",    # portal dates/timestamps are handled as naive local datetimes by design
    "BLE001", # deliberate broad except-and-report pattern around portal HTTP calls
    "RUF022", # __all__ lists are intentionally grouped by category (Client/Command/Render), not alphabetical
]
