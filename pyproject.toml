[project]
name = "bhoonidhi-downloader"
version = "0.6.0"
description = "CLI and SDK for ISRO's EO Portal - Bhoonidhi Browse & Order"
license = "MIT"
authors = [
    { name = "geovicco-dev", email = "geovicco.dev@gmail.com" }
]
dependencies = [
    "typer>=0.12.3",
    "requests>=2.32.3",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "tabulate>=0.9.0",
]
readme = "README.md"
requires-python = ">= 3.10"

urls = { "Repository" = "https://github.com/geovicco-dev/bhoonidhi-downloader" }

[project.scripts]
"bhoonidhi-downloader" = "bhoonidhi_downloader.cli:app"
"bhd" = "bhoonidhi_downloader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# The docs and notebook tools need Python 3.12 or newer: the Pillow,
# soupsieve and tornado releases that fix their security advisories do
# not install on 3.10 (soupsieve's needs 3.11.5). The package itself
# still supports 3.10.
dev = [
    "ruff>=0.14.0",
    "pytest>=8.3.0",
    "ipykernel>=6.29.5; python_version >= '3.12'",
    "pyyaml>=6.0.1",
    "cairosvg>=2.7.1; python_version >= '3.12'",
    "mkdocs-material[imaging]>=9.5.30; python_version >= '3.12'",
    "ipywidgets>=8.1.3; python_version >= '3.12'",
    "python-dotenv>=1.2.2",
    "mkdocstrings[python]>=1.0.6; python_version >= '3.12'",
    "mkdocs-jupyter>=0.25.1; python_version >= '3.12'",
    "griffe-pydantic>=1.3.1; python_version >= '3.12'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bhoonidhi_downloader"]
# Ship the PEP 561 marker so installed consumers' type checkers read the
# package's type hints instead of treating it as untyped.
force-include = { "src/bhoonidhi_downloader/py.typed" = "bhoonidhi_downloader/py.typed" }

[tool.ruff.lint]
ignore = [
    "B008",   # typer.Option()/typer.Argument() as default args is the required idiom
    "DTZ",    # portal dates/timestamps are handled as naive local datetimes by design
    "BLE001", # deliberate broad except-and-report pattern around portal HTTP calls
    "RUF022", # __all__ lists are intentionally grouped by category (Client/Command/Render), not alphabetical
]
