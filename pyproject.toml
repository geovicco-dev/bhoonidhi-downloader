[project]
name = "bhoonidhi-downloader"
version = "0.2.0"
description = "CLI and Python SDK for searching, saving, and downloading satellite data from Bhoonidhi"
license = "MIT"
authors = [
    { name = "geovicco-dev", email = "geovicco.dev@gmail.com" }
]
dependencies = [
    "typer>=0.12.3",
    "requests>=2.32.3",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "tabulate>=0.9.0",
]
readme = "README.md"
requires-python = ">= 3.10"

urls = { "Repository" = "https://github.com/geovicco-dev/bhoonidhi-downloader" }

[project.scripts]
"bhoonidhi-downloader" = "bhoonidhi_downloader.cli:app"
"bhd" = "bhoonidhi_downloader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "ipykernel>=6.29.5",
    "pyyaml>=6.0.1",
    "tabulate>=0.9.0",
    "bhoonidhi>=0.1.0",
    "cairosvg>=2.7.1",
    "mkdocs-material[imaging]>=9.5.30",
    "ipywidgets>=8.1.3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bhoonidhi_downloader"]
