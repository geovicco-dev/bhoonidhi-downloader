name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for the suggestion. Describing the problem first — before the
        solution — helps us find the best approach together.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that's hard or impossible today?
      placeholder: I'm trying to ... but currently ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to see
      description: How might the tool solve this? A rough idea is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds you're using now, or other approaches you thought about.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Your use case, example data, or anything that adds context.
