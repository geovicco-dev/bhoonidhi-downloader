name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. A clear report helps it get fixed faster.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
      placeholder: I ran `bhd query create ...` and it failed with ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command(s) or code you ran. Please remove any credentials.
      render: shell
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Paste the full error or unexpected output, if any. Remove any tokens or personal data.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `bhd --version` (or the installed package version).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: e.g. Ubuntu 24.04, Python 3.12
    validations:
      required: true
