name: Publish to TestPyPI

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - name: Publish to TestPyPI
        env:
          UV_PUBLISH_URL: https://test.pypi.org/legacy/
        run: uv publish
